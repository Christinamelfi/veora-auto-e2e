name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start dev server
        run: npm run dev &
        env:
          CI: true

      - name: Wait for server to start
        run: npx wait-on http://localhost:5173 --timeout 120000
        env:
          CI: true

      - name: Run E2E tests (Shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'demo@veora.local' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Demo123!@#' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  report:
    name: Publish Test Report
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright Test Results
          path: '*/junit.xml'
          reporter: 'java-junit'
          fail-on-error: false

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let totalPassed = 0;
            let totalFailed = 0;

            // Read test results from all shards
            for (let i = 1; i <= 4; i++) {
              const junitPath = `playwright-report-shard-${i}/junit.xml`;
              if (fs.existsSync(junitPath)) {
                const content = fs.readFileSync(junitPath, 'utf8');
                const passMatch = content.match(/tests="(\d+)"/);
                const failMatch = content.match(/failures="(\d+)"/);
                if (passMatch) {
                  const failures = failMatch ? parseInt(failMatch[1]) : 0;
                  const total = parseInt(passMatch[1]);
                  totalPassed += (total - failures);
                  totalFailed += failures;
                }
              }
            }

            const status = totalFailed === 0 ? '✅ PASSED' : '❌ FAILED';
            const comment = `## ${status} - Playwright E2E Tests

- **Passed:** ${totalPassed}
- **Failed:** ${totalFailed}
- **Total:** ${totalPassed + totalFailed}

[View full test report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
